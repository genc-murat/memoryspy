# The test suite, on the one runner that can exercise every part of it.
#
# Three things make this more than `cargo test`:
#
# * **The collector and the sample have to be built first.** The host/collector contract tests
#   attach to a real leaking process, so a machine without `npm run prepare:all` fails them for a
#   reason that has nothing to do with the code.
# * **The Docker transport tests need the Linux collector.** They start their own throwaway
#   container (`docker_container.rs`), but the binary they copy into it is published by
#   `npm run collector:docker` — the one prerequisite a Docker daemon cannot provide itself.
# * **A skipped Docker test is a failed job.** Those tests skip when no daemon is reachable, which
#   is right on a laptop and wrong here: a green run that never touched a container would claim
#   coverage it does not have. The step therefore greps the run's own output for the skip message.
#
# Only Ubuntu runs the whole suite: the contract tests spawn the sample with `dotnet` and the
# Docker tests need a Linux daemon, which the hosted Windows and macOS runners do not provide in
# the same shape. The installers themselves are built by `release.yml`.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same branch makes the previous run's answer irrelevant.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The collector targets net10.0 and speaks to the profiled process through the .NET 10
      # diagnostics stack, so the SDK major must match the csproj.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's Linux build dependencies. `cargo test` compiles the same crate the app does, so
      # webkit2gtk and GTK have to be present even though no window is ever opened.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build the frontend
        run: |
          npm run typecheck
          npm run build

      - name: Build the collector and the sample
        run: npm run prepare:all

      # The tests copy this file into a container and start it with `docker exec`, so publishing
      # the host build instead would leave every container test failing on "exec format error".
      - name: Publish the Linux collector for container targets
        run: npm run collector:docker

      - name: Report the Docker environment
        run: |
          docker version
          docker info --format '{{json .ServerVersion}}'

      # `--lib` carries the Docker CLI deadline's unit tests (a hanging command must be killed at
      # its timeout); without the selector those tests would never run in CI.
      - name: Host and collector tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --lib \
            --test collector_contract \
            --test recording_replay

      # `tee` keeps the exit status of the test run (via `pipefail`) while making its output
      # greppable, which is what the skip check below needs. The redirect is not optional: a test
      # that skips does it with `eprintln!`, so a stdout-only capture would never see the message
      # the check is looking for.
      - name: Docker transport tests
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test docker_container -- --nocapture 2>&1 | tee docker-tests.log

          if grep -q '^skipping:' docker-tests.log; then
            echo "::error::The Docker transport tests skipped, so no container was profiled."
            exit 1
          fi

      - name: Keep the test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-tests-log
          path: docker-tests.log
          if-no-files-found: ignore
